[package]
name = "ai-customer-service"
version = "0.1.0"
description = "AI 智能客服桌面端"
authors = ["you"]
edition = "2021"

[lib]
name = "ai_customer_service_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
